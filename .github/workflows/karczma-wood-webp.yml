name: Karczma — Seamless wooden background WebP
on:
  push:
    branches: [karczma]
    paths:
      - '.github/workflows/karczma-wood-webp.yml'
      - 'assets/images/drewno-bezszwowe-source.jpg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow and NumPy
        run: python -m pip install pillow numpy
      - name: Create truly tileable WebP
        run: |
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          from PIL import Image
          base = Path('assets/images')
          src = Image.open(base / 'drewno-bezszwowe-source.jpg').convert('RGB')
          data = np.asarray(src, dtype=np.float32).copy()
          h, w = data.shape[:2]
          assert w >= 1100 and h >= 850, (w, h)
          # Rejoin opposite edge pixels after transport compression.
          for i in range(36):
              t = 0.5 * (1-i/36)**1.7
              l, r = data[:, i].copy(), data[:, w-1-i].copy()
              data[:, i] = (1-t)*l + t*r
              data[:, w-1-i] = (1-t)*r + t*l
          for i in range(12):
              t = 0.5 * (1-i/12)**1.5
              a, b = data[i].copy(), data[h-1-i].copy()
              data[i] = (1-t)*a + t*b
              data[h-1-i] = (1-t)*b + t*a
          pixels = data.clip(0,255).astype('uint8')
          assert np.array_equal(pixels[:,0],pixels[:,-1]), 'Side borders must match'
          assert np.array_equal(pixels[0],pixels[-1]), 'Top and bottom must match'
          output = base / 'drewno-bezszwowe.webp'
          Image.fromarray(pixels,mode='RGB').save(output,'WEBP',lossless=True,method=6)
          print(output, (w,h), output.stat().st_size)
          PY
      - name: Commit WebP (only karczma)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/drewno-bezszwowe.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(karczma): generate seamless pixel-art wooden boards WebP"
            git push
          fi
