name: Generate Calion WebP assets
on:
  push:
    branches: [dev-mode]
    paths:
      - '.github/workflows/generate-webp.yml'
      - 'assets/images/mapa-duza.jpg'
      - 'assets/images/ilustracje-duze.jpg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Build optimized WebP from high-resolution source images
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          out = Path("assets/images")
          map_image = Image.open(out / "mapa-duza.jpg").convert("RGB")
          assert map_image.width >= 1400 and map_image.height >= 900, map_image.size
          map_image.save(out / "mapa.webp", format="WEBP", quality=84, method=6)
          collage = Image.open(out / "ilustracje-duze.jpg").convert("RGB")
          w, h = collage.size
          assert w >= 1500 and h >= 1000, collage.size
          images = {
            "port.webp": (0, 0, w//2, h//2),
            "ralfor.webp": (0, h//2, w//2, h),
            "warg.webp": (w//2, h//2, w, h)
          }
          for filename, bounds in images.items():
              crop = collage.crop(bounds)
              crop.save(out / filename, format="WEBP", quality=88, method=6)
              print(filename, crop.size, (out / filename).stat().st_size)
          print("mapa.webp", map_image.size, (out / "mapa.webp").stat().st_size)
          PY
      - name: Commit converted images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/mapa.webp assets/images/port.webp assets/images/ralfor.webp assets/images/warg.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: replace low-resolution illustrations with optimized WebP"
            git push
          fi
