name: Karczma — hero to WebP
on:
  push:
    branches: [karczma]
    paths:
      - 'assets/images/karczma-wnetrze.jpg'
      - '.github/workflows/karczma-webp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Convert to WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base=Path('assets/images')
          img=Image.open(base/'karczma-wnetrze.jpg').convert('RGB')
          assert img.width >= 1500 and img.height >= 800, img.size
          img.save(base/'karczma-wnetrze.webp',format='WEBP',quality=90,method=6)
          print('hero:',img.size,(base/'karczma-wnetrze.webp').stat().st_size)
          PY
      - name: Commit WebP hero on karczma only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/karczma-wnetrze.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(karczma): optimize tavern hero as WebP"
            git push
          fi
